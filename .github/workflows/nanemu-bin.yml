name: Go Build

on:
  push:
    tags:
      - 'v*'
    branches:
      - test_build

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        goos: [linux, windows, darwin]
        goarch: [amd64, arm64]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Clean up old build files (if any)
        run: |
          rm -rf nanemu-*

      - name: Install dependencies
        run: |
          go mod tidy

      - name: Build the Go binary
        run: |
          GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} go build -o nanemu-${{ matrix.goos }}-${{ matrix.goarch }}-${{ github.ref_name }} ./cmd/nanemu

      - name: Upload release binary
        uses: softprops/action-gh-release@v1
        with:
          files: nanemu-*
          tag_name: ${{ github.ref_name }}

name: Go Build

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions: write-all

    strategy:
      matrix:
        goos: [linux, windows, darwin]
        goarch: [amd64, arm64]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Clean up old build files (if any)
        run: |
          rm -rf nanemu-*

      - name: Install dependencies
        run: |
          go mod tidy

      - name: Build the Go binary
        run: |
          GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} go build -o nanemu-${{ matrix.goos }}-${{ matrix.goarch }}-${{ github.ref_name }} ./cmd/nanemu

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: nanemu-${{ matrix.goos }}-${{ matrix.goarch }}
          path: nanemu-${{ matrix.goos }}-${{ matrix.goarch }}-${{ github.ref_name }}
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Upload release binary
        uses: softprops/action-gh-release@v2
        with:
          files: dist/nanemu-*
          tag_name: ${{ github.ref_name }}
